extend type Query {
    environment(id: ID!): Environment
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\Environment\\Environment")
    environments(projectId: ID!): [Environment!]!
        @guard
        @paginate(
            type: CONNECTION
            builder: "App\\GraphQL\\Queries\\Environment\\Environments"
            defaultCount: 20
            maxCount: 100
        )
}

extend type Mutation {
    createEnvironment(input: CreateEnvironmentInput!): Environment!
        @guard
        @verified
        @field(resolver: "App\\GraphQL\\Mutations\\Environment\\CreateEnvironment")
    updateEnvironment(input: UpdateEnvironmentInput!): Environment!
        @guard
        @verified
        @field(resolver: "App\\GraphQL\\Mutations\\Environment\\UpdateEnvironment")
    deleteEnvironment(id: ID!): Boolean!
        @guard
        @verified
        @field(resolver: "App\\GraphQL\\Mutations\\Environment\\DeleteEnvironment")
}

type Environment {
    id: ID! @rename(attribute: "uuid")
    name: String!
    description: String
    server: Server @field(resolver: "App\\GraphQL\\Queries\\Environment\\EnvironmentServer")
}

input CreateEnvironmentInput {
    projectId: ID!
    name: String! @trim
    serverId: ID
    description: String @trim
}

input UpdateEnvironmentInput {
    id: ID!
    name: String! @trim
    serverId: ID
    description: String @trim
}
